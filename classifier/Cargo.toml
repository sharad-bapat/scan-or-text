[package]
name = "scan_or_text"
version = "0.1.0"
edition = "2021"
description = "Does this PDF need OCR? A minimal structural classifier: no rendering, no text extraction."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "scan-or-text"
path = "src/main.rs"

[dependencies]
# The PDF reading shared with wordbox and where-are-the-regions (D4): object index, filters, decryption, pages.
pdf-core = { path = "../../pdf-core" }
wasm-bindgen = { version = "0.2", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
