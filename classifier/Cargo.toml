[package]
name = "scan_or_text"
version = "0.1.0"
edition = "2021"
description = "Does this PDF need OCR? A minimal structural classifier: no rendering, no text extraction."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "scan-or-text"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
# Decryption of PDFs that open with an empty user password (standard handler R2-R4: RC4, AES-128).
md-5 = "0.10"
aes = "0.8"
wasm-bindgen = { version = "0.2", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
